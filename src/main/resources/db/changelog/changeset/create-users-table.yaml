databaseChangeLog:
  - changeSet:
      id: 1790873939464-1
      author: Andrii
      changes:
        - createSequence:
            sequenceName: users_seq
            incrementBy: 50
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(75)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: hash_password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_role
                  type: VARCHAR(14)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_users_tenant
                    references: tenants(id)
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  constraints:
                    nullable: false



