version: '3.8'

services:
  postgres-db:
    image: postgres:17
    container_name: subscript-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Додаємо перевірку готовності бази
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-app:
    build: .
    container_name: subscript-app
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        # Чекаємо не просто старту контейнера, а статусу "healthy"
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/billing_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: on-failure

volumes:
  pg_data: